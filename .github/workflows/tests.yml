name: Website checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/run-tests.cjs
      - run: node scripts/build-workbench-preview.cjs --check
      - run: node scripts/build-sql.cjs --check
      - run: node scripts/version-assets.cjs --check
      - run: node scripts/build-tool-release.cjs --check
      - run: npm install --prefix /tmp/pi-test --no-audit --no-fund @electric-sql/pglite@0.5.10
      - run: node tests/run-install-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: node tests/run-device-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: node tests/run-tools-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: node tests/run-desktop-updates-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: node tests/run-classroom-controls-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: node tests/run-clear-course-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: python3 -m unittest discover -s tests -p test_reporting_audit.py -v
      - run: python3 -m unittest discover -s tests -p test_reset_pi10.py -v
      - run: node tests/run-observed-commands-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: python3 -m unittest discover -s tests -p test_desktop_updater.py
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb pcmanfm xdotool dbus-x11
      - run: xvfb-run -a /usr/bin/python3 -B tests/test_desktop_gui.py -v
      - run: sudo env PI_HELPER_TEST_DESKTOP_LAUNCHER=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 -B tests/test_desktop_launcher.py -v
      - run: python3 -m unittest discover -s tests -p test_tool_install.py
      - run: sudo python3 tests/test_installer_permissions.py -v
      - run: python3 -m unittest discover -s tests -p test_device_agent.py
      - run: node tests/run-camera-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - run: node tests/run-course-history-sql.cjs
        env:
          PGLITE_ROOT: /tmp/pi-test/node_modules/@electric-sql/pglite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --target /tmp/pi-camera-python -r tests/requirements-camera.txt
      - run: python3 -m unittest discover -s tests -p test_camera_course.py -v
        env:
          PYTHONPATH: /tmp/pi-camera-python
