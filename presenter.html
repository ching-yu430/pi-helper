<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老師上課模式</title><link rel="stylesheet" href="course.css?v=55a711b4b0f6"><link rel="stylesheet" href="responsive.css?v=55a711b4b0f6"><link rel="stylesheet" href="learning-tools.css?v=55a711b4b0f6"><link rel="stylesheet" href="site.css?v=55a711b4b0f6"></head>
<body class="presenter-page page-presenter"><header><div><nav class="site-nav"><a href="index.html">課程首頁</a><a href="assistant.html">工作台管理</a></nav><h1>老師上課模式</h1><p>先預覽教材，準備好再按「開始帶課」。學生從課程首頁開啟老師指定步驟。</p></div></header>
<main>
<form id="presenterLogin"><label>登入密碼<input id="presenterPassword" type="password" autocomplete="current-password" required></label><button type="submit">登入上課模式</button></form>
<p id="presenterStatus" role="status"></p>
<section id="presenterControls" hidden aria-label="上課控制">
<div class="presenter-selects"><label>目前課程<select id="presenterLesson"></select></label><label>指定步驟<select id="presenterStep"></select></label></div>
<div class="presenter-actions">
<div class="presenter-publish"><p id="presenterMode" role="status"></p><button id="presenterPublish" type="button" class="primary">開始帶課</button></div><button id="presenterFullscreen" type="button">全螢幕</button>
<details id="presenterOptions" class="presenter-options"><summary><span>教學工具</span><span id="presenterHelpBadge" class="presenter-help-badge" hidden></span></summary><div class="presenter-options-panel"><p id="presenterPublished" class="muted"></p><button id="presenterHelp" type="button">讀取求助中…</button><button id="presenterPause" type="button">先停在這裡</button><button id="presenterShutdown" type="button">準備下課</button><label>示範組別<select id="presenterGroup"></select></label><button id="presenterLarger" type="button">放大文字</button><button id="presenterLogout" type="button">登出</button><a id="presenterPauseSetup" href="classroom-setup.html#presenterUpgrade" target="_blank" rel="noopener">啟用全班暫停提示 ↗</a></div></details>
</div></section>
<section id="presenterSlide" hidden aria-live="polite"></section>
<nav id="presenterNavigation" hidden aria-label="教學步驟"><button id="presenterBack" type="button">← 上一步</button><p id="presenterCounter"></p><button id="presenterNext" type="button">下一步 →</button></nav>
<dialog id="presenterHelpDialog" class="presenter-help-dialog" aria-labelledby="presenterHelpTitle"><div class="presenter-dialog-heading"><h2 id="presenterHelpTitle">全班求助狀況</h2><button id="presenterHelpClose" type="button">關閉</button></div><p id="presenterHelpStatus" role="status"></p><div id="presenterHelpGroups"></div><button id="presenterHelpRefresh" type="button">立即更新求助</button></dialog>
<dialog id="presenterImageDialog" class="presenter-image-dialog" aria-labelledby="presenterImageTitle"><div class="presenter-dialog-heading"><h2 id="presenterImageTitle">圖片重點</h2><button id="presenterImageClose" type="button">關閉圖片</button></div><div class="presenter-image-tools"><button id="presenterZoomOut" type="button" aria-label="縮小圖片">−</button><span id="presenterZoomLevel" role="status">100%</span><button id="presenterZoomIn" type="button" aria-label="放大圖片">＋</button><button id="presenterZoomReset" type="button">還原大小</button><button id="presenterMark" type="button" aria-pressed="true">標示重點</button><button id="presenterClearMarks" type="button">清除標示</button></div><p id="presenterImageHint" class="muted" role="status">在圖片上點一下，加入編號圓圈。</p><div class="presenter-image-scroll"><div id="presenterImageStage" class="presenter-image-stage"><img id="presenterZoomImage" alt=""><div id="presenterImageMarks" class="presenter-image-marks"></div></div></div></dialog>
</main>
<script src="config.js?v=55a711b4b0f6"></script><script src="sync-client.js?v=55a711b4b0f6"></script><script src="classroom-groups.js?v=55a711b4b0f6"></script><script src="command-steps.js?v=55a711b4b0f6"></script><script src="flash-values.js?v=55a711b4b0f6"></script><script src="operation-images.js?v=55a711b4b0f6"></script><script src="learning-common.js?v=55a711b4b0f6"></script><script src="camera-catalog.js?v=55a711b4b0f6"></script><script src="lesson-catalog.js?v=55a711b4b0f6"></script><script src="camera-slides.js?v=55a711b4b0f6"></script><script src="presenter.js?v=55a711b4b0f6"></script>
</body></html>
